
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovery OS v1.0 - White Spatial Interface</title>
    <meta name="description" content="Interactive 3D spatial interface rendered in Three.js featuring interactive floating UI nodes and mouse gesture navigation." />
    <meta property="og:title" content="Discovery OS v1.0 - White Spatial Interface" />
    <meta property="og:description" content="Interactive 3D spatial interface rendered in Three.js featuring interactive floating UI nodes and mouse gesture navigation." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #F2F2EF;
        --text-color: #1A1A19;
      }
      body { 
        margin: 0; 
        overflow: hidden; 
        background-color: var(--bg-color); 
        color: var(--text-color); 
        font-family: 'Rajdhani', sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      canvas { display: block; outline: none; }
      
      /* Subtle geometric architectural noise for texture */
      body::after {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.035;
        pointer-events: none;
        z-index: 9999;
      }

      ::-webkit-scrollbar { display: none; }

      .transition-spatial {
        transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
